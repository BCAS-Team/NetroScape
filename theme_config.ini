
# If this file is deleted or a key is missing/misspelled, the app falls
# back to the built-in defaults below instead of crashing.
[colors]
# --- Title bar (the dark strip at the very top with the window name) ---
title_bar_gradient_start = #0B2D5C
title_bar_gradient_mid   = #1E5FA3
title_bar_gradient_end   = #0B2D5C

# Minimize / maximize / close glyphs on the title bar
title_button_text       = #FFFFFF
title_button_hover_bg   = rgba(255, 255, 255, 110)
title_button_hover_text = #0B2D5C
title_button_pressed_bg = rgba(255, 255, 255, 160)
close_button_hover      = #E81123
close_button_pressed    = #A80F1C

# --- General chrome: menu bar, toolbar, status bar, tab strip background ---
chrome_background = #FFFFFF
chrome_border     = #7A9AB8
text              = #16283A

# --- Buttons: toolbar nav buttons, Go button, menu/tab hover states ---
button_face           = #FFFFFF
button_hover          = #C7DDF2
button_hover_border   = #4C7FA8
button_pressed        = #A8C7E2
button_pressed_border = #315F89

# --- Tabs ---
tab_active_background   = #FFFFFF
tab_inactive_background = #F2F2F2
tab_border              = #6689A8

# --- Address bar text-selection highlight ---
address_selection_bg   = #9B6FD1
address_selection_text = #FFFFFF

# --- Go button ---
go_button_face         = #174A8C
go_button_hover        = #245F9F
go_button_pressed      = #0B2D5C
go_button_text         = #FFFFFF

# --- Interface icons ---
# Set any value to an image path (.png, .ico, .svg, etc.). Relative paths
# are resolved from this file's directory. Blank or missing files use the
# normal Qt icon automatically.
[icons]
minimize    =
maximize    =
close       =
back        =
forward     =
stop        =
refresh     =
home        =
new_tab     =
close_tab   =
clear_cache =
reset_zoom  =
about       =
shortcuts   =
exit        =

[layout]
# Corner radius (px) for the custom title bar.
# NOTE: the window itself is a plain square frameless window, so any
# radius above 0 leaves a small light-colored notch where the rounded
# bar doesn't quite meet the square window edge (this is what caused
# the "curved top bar" look). Keep at 0 for a clean flush edge; true
# rounded corners would need the window's shape masked too, which this
# config file alone can't do.
title_bar_corner_radius = 0
title_bar_height = 28
window_width      = 1200
window_height     = 800
toolbar_button_width  = 34
toolbar_button_height = 28
address_bar_width     = 650
go_button_width       = 52
tab_close_size        = 18
title_button_width    = 28
title_button_height   = 20

font_family       = Times New Roman
menu_font_size    = 12
toolbar_font_size = 11
tab_font_size     = 11
status_font_size  = 11
