<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Classic Google Search — Settings</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #202124;
      --muted: #5f6368;
      --border: #e8eaed;
      --accent: #1a73e8;
      --hover: #f1f3f4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --fg: #e8eaed;
        --muted: #9aa0a6;
        --border: #3c4043;
        --accent: #8ab4f8;
        --hover: #303134;
      }
    }
    * { box-sizing: border-box; }
    body {
      max-width: 560px;
      margin: 40px auto;
      padding: 0 20px;
      background: var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }
    h1 { font-size: 20px; }
    h2 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 28px; }
    section {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 8px;
    }
    label.row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 4px;
      border-radius: 8px;
      cursor: pointer;
    }
    label.row:hover { background: var(--hover); }
    label.row input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
    textarea {
      width: 100%;
      min-height: 120px;
      margin-top: 8px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      resize: vertical;
    }
    button {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: var(--hover); }
    button.danger { color: #d93025; border-color: #d93025; }
    .save-note {
      font-size: 12px;
      color: var(--muted);
      margin-left: 10px;
    }
    footer { margin-top: 28px; margin-bottom: 40px; display: flex; align-items: center; }
  </style>
</head>
<body>
  <h1>Classic Google Search — Settings</h1>

  <h2>Diagnostics</h2>
  <section>
    <label class="row">
      <input type="checkbox" id="enableLogging" />
      <span>Enable console logging</span>
    </label>
    <label class="row">
      <input type="checkbox" id="debugMode" />
      <span>Debug mode (verbose selector match info)</span>
    </label>
  </section>

  <h2>Custom CSS</h2>
  <section>
    <p style="color: var(--muted); font-size: 12px; margin-top: 0;">
      Optional CSS injected on Google Search pages. Runs entirely on your
      device — nothing here is sent anywhere.
    </p>
    <textarea id="customCSS" placeholder="/* e.g. #search { max-width: 700px; } */" spellcheck="false"></textarea>
  </section>

  <footer>
    <button id="resetBtn" class="danger">Reset all settings</button>
    <span class="save-note" id="saveNote"></span>
  </footer>

  <script src="storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
